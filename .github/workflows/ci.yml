name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Package is valid for every bundler and TypeScript resolution mode
        run: pnpm check:package
      - run: pnpm build:site
      - name: Claude skill references are up to date
        run: pnpm skill:refs && git diff --exit-code plugin/
