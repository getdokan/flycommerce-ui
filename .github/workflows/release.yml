name: Release

# Pushing a version tag (vX.Y.Z, or vX.Y.Z-beta.N for a pre-release) publishes that
# version to npm with provenance and creates the GitHub release from CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance and Trusted Publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      # Only the first release needs a token; after that npm Trusted Publishing is used.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1

      - name: Check the tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION. Bump the version first."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that isn't on main. Tag a commit on main."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$VERSION" in
            *-*) echo "NPM_TAG=next" >> "$GITHUB_ENV"; echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *) echo "NPM_TAG=latest" >> "$GITHUB_ENV"; echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section. Add one before tagging."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package

      - name: Check the version isn't already on npm
        run: |
          if npm view "@flycommerce/ui@$VERSION" version >/dev/null 2>&1; then
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
            echo "::notice::@flycommerce/ui@$VERSION is already on npm; skipping publish."
          fi

      - name: Publish to npm (token, first release only)
        if: env.ALREADY_PUBLISHED != 'true' && env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (Trusted Publishing)
        if: env.ALREADY_PUBLISHED != 'true' && env.HAS_NPM_TOKEN != 'true'
        run: npm publish --provenance --access public --tag "$NPM_TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub release $TAG already exists."
          else
            gh release create "$TAG" --title "$VERSION" --notes-file release-notes.md --verify-tag \
              $( [ "$PRERELEASE" = true ] && echo --prerelease )
          fi
