version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR per week for minor/patch bumps; majors arrive one by one so they get a real review.
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    ignore:
      # The dev pins test CodeMirror at the lowest versions the optional peers accept (the dashboard's); raise them by hand with the peer ranges.
      - dependency-name: "@codemirror/*"
      # Types follow the Node that CI and releases run on (22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # v9 rewrites the table API: DataTable and every app's ColumnDef change. Migrate on purpose, in its own release.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
